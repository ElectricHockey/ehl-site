<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Awards – EHL</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preload" href="/api/site-logo" as="image" fetchpriority="high" />
  <script src="nav.js" defer></script>
  <script src="season-selector.js" defer></script>
  <script src="awards.js" defer></script>
  <style>
    .awards-page { max-width: 1200px; margin: 0 auto; padding: 1.5rem 1rem 2rem; }
    .awards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }
    .award-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 0.9rem;
      display: grid;
      gap: 0.75rem;
    }
    .award-head {
      display: flex;
      gap: 0.7rem;
      align-items: center;
      min-height: 52px;
    }
    .award-image {
      width: 46px;
      height: 46px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid #30363d;
      background: #0d1117;
      flex-shrink: 0;
    }
    .award-title { font-weight: 700; color: #e6edf3; line-height: 1.2; }
    .award-desc { color: #8b949e; font-size: 0.78rem; }
    .award-list { display: grid; gap: 0.35rem; }
    .award-line {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(140, 160, 185, 0.18);
      border-radius: 8px;
      padding: 0.4rem 0.55rem;
      font-size: 0.86rem;
      color: #c9d1d9;
    }
    .award-empty { color: #8b949e; font-style: italic; font-size: 0.84rem; }
    .award-player {
      color: #58a6ff;
      text-decoration: none;
      font-weight: 600;
    }
    .award-player:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <nav>
    <a href="index.html" class="brand">
      <img src="/api/site-logo" alt="EHL" class="brand-logo" width="46" height="46" decoding="async" fetchpriority="high" />
    </a>
    <a href="index.html">Home</a>
    <a href="schedule.html">Schedule</a>
    <div class="nav-dropdown">
      <a href="standings.html">Standings ▾</a>
      <div class="nav-dropdown-menu">
        <a href="recent-scores.html">🏒 Recent Scores</a>
      </div>
    </div>
    <a href="stats.html">Stats</a>
    <a href="records.html">Records</a>
    <a href="players.html">Players</a>
    <a href="admin.html" id="nav-admin-link" style="display:none">Admin</a>
    <a href="register.html" class="nav-portal">Player Portal</a>
  </nav>

  <div class="awards-page page-shell">
    <div class="page-header">
      <div class="page-eyebrow">League Honors</div>
      <h1 id="awards-page-title">Awards</h1>
      <p class="page-subtitle">View award winners for each season.</p>
    </div>
    <div id="season-selector-container"></div>
    <div id="awards-root" style="margin-top:0.8rem;">
      <p class="loading">Loading awards…</p>
    </div>
  </div>
</body>
</html>
