<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team – EHL</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preload" href="/api/site-logo" as="image" fetchpriority="high" />
  <script src="nav.js" defer></script>
  <script src="notifications.js" defer></script>
  <script src="season-selector.js" defer></script>
  <script src="stats-config.js?v=custom-ovr-1" defer></script>
  <script src="game-outcome.js?v=1" defer></script>
  <script src="team.js?v=forfeit-winner-1" defer></script>
  <style>
    .season-stats-table { font-size: 0.85rem; }
    .season-stats-table thead th { font-size: 0.72rem; }
    .sortable-th { cursor: pointer; user-select: none; }
    .sortable-th:hover { color: #58a6ff; }
    .sortable-th.sort-asc::after  { content: ' ▲'; color: #58a6ff; }
    .sortable-th.sort-desc::after { content: ' ▼'; color: #58a6ff; }
    .no-stats { color: #8b949e; padding: 1rem 0; }
    .league-tabs-row .team-league-tab,
    .league-tabs-row .team-view-tab,
    #stats-tab-btns .lt-tab {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 7px;
      color: #c9d1d9;
      padding: 0.45rem 0.75rem;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
    }
    .league-tabs-row .lt-tab-active,
    #stats-tab-btns .lt-tab-active {
      background: rgba(var(--team-tab-rgb), 0.4);
      border-color: rgb(var(--team-tab-rgb));
      box-shadow: 0 0 0 1px rgba(255,255,255,0.22), 0 0 14px rgba(var(--team-tab-rgb), 0.75);
      color: #fff;
      font-weight: 700;
    }
    .league-tabs-row button:focus-visible,
    #stats-tab-btns button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    /* Records tabs */
    .rec-tab { transition: background 0.15s, color 0.15s; }
    .rec-tab-active { background: #388bfd !important; color: #fff !important; }
    /* Responsive two-column layout */
    @media (max-width: 780px) {
      .team-page-grid { grid-template-columns: 1fr !important; }
    }
    /* Prevent roster player stat row from forcing width */
    .team-page-grid > div { min-width: 0; overflow: visible; }
  </style>
</head>
<body>
  <nav>
    <a href="index.html" class="brand">
      <img src="/api/site-logo" alt="EHL" class="brand-logo" width="46" height="46" decoding="async" fetchpriority="high" />

    </a>
    <a href="index.html">Home</a>
    <a href="schedule.html">Schedule</a>
    <div class="nav-dropdown">
      <a href="standings.html" class="active">Standings ▾</a>
      <div class="nav-dropdown-menu">
        <a href="recent-scores.html">🏒 Recent Scores</a>
      </div>
    </div>
    <a href="stats.html">Stats</a>
    <a href="records.html">Records</a>
    <a href="players.html">Players</a>
    <a href="admin.html" id="nav-admin-link" style="display:none">Admin</a>
    <a href="register.html" class="nav-portal">Player Portal</a>
  </nav>

  <div class="container page-shell">
    <div id="team-root"><p class="loading">Loading…</p></div>
  </div>

</body>
</html>
